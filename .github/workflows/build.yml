name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and Locate Project
        run: |
          mkdir -p src
          unzip -q "projetao.zip" -d src
          
          # Procura o settings.gradle.kts onde quer que ele esteja
          SETTINGS_FILE=$(find src -name "settings.gradle.kts" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRO FATAL: settings.gradle.kts nao foi encontrado dentro do zip!"
            exit 1
          fi
          
          # Pega o diretorio onde o arquivo esta
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          
          echo "--- Projeto encontrado em: $PROJECT_DIR ---"
          ls -la "$PROJECT_DIR"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KuroPerformance-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          retention-days: 30
